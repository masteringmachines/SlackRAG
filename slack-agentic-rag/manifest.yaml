# Slack app manifest: api.slack.com/apps -> Create New App -> From a manifest -> paste this.
display_information:
  name: Knowledge Agent
  description: Agentic RAG assistant that answers from files you share in Slack
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Knowledge Agent
    always_online: true
  slash_commands:
    - command: /kb
      description: Manage this channel's knowledge base
      usage_hint: "[list | delete <name> | forget | help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - file_shared
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
